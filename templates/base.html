{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Freelance{% endblock %} · Freelance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/site.css' %}">
</head>
<body>
  {% include 'includes/navigation.html' %}
  <main class="container py-4 py-md-5">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer py-4 mt-auto border-top">
    <span>© <span id="current-year"></span> Freelance</span>
  </footer>
  <script src="{% static 'homepage/js/main.js' %}" defer></script>
</body>
</html>
